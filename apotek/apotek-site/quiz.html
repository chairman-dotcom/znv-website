<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ritual Wizard — Build Your Formula | Apotek</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#12211a;
    --paper:#0e1a15;
    --moss:#1f9e6f;
    --moss-hover:#17845c;
    --moss-dark:#0e1a15;
    --clay:#0e7a94;
    --warn:#c17a3f;
    --warn-bg:#f7ece2;
    --line:#d8e5dc;
    --muted:#55655c;
    --muted-lt:#7c8a80;
    --card:#f4f9f6;
    --card-alt:#e6f0ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .back-link{
    width:100%;
    max-width:640px;
    margin:0 auto 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.04em;
    color:#c8dcd2;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .back-link .dot{width:6px;height:6px;border-radius:50%;background:var(--moss);display:inline-block;}
  .back-link a{color:#c8dcd2; text-decoration:none;}
  .back-link a:hover{color:#fff;}
  .rx{
    width:100%;
    max-width:640px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow: 0 1px 0 var(--line), 0 24px 50px -20px rgba(0,0,0,0.55);
    position:relative;
    overflow:hidden;
  }
  .rx::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:repeating-linear-gradient(90deg, var(--moss) 0 18px, #b084f5 18px 20px);
    opacity:.9;
  }
  header.top{
    padding:22px 32px 0;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-family:'Fraunces', serif;
  }
  .mark{
    font-size:1rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .mark b{color:var(--moss); font-weight:600;}
  .rx-no{
    font-size:.72rem;
    color:#7c8a80;
    letter-spacing:.05em;
    font-family:'IBM Plex Mono', monospace;
  }
  .track-wrap{
    padding:14px 32px 0;
  }
  .track{
    height:3px;
    background:#33413a;
    border-radius:2px;
    overflow:hidden;
  }
  .track-fill{
    height:100%;
    background:var(--moss);
    width:0%;
    transition:width .4s cubic-bezier(.65,0,.35,1);
  }
  .step-label{
    display:flex;
    justify-content:space-between;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8fa89b;
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
  }
  .panel{
    padding:36px 32px 32px;
    min-height:360px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .eyebrow{
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--clay);
    font-weight:500;
    margin-bottom:10px;
    font-family:'IBM Plex Mono', monospace;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.7rem;
    line-height:1.25;
    margin:0 0 10px;
    color:var(--moss-dark);
  }
  .sub{
    font-size:.9rem;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 26px;
  }
  .field{
    margin-bottom:18px;
  }
  label.flabel{
    display:block;
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
    font-family:'IBM Plex Mono', monospace;
  }
  input[type=text], input[type=email], select{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:1px;
    font-family:'Work Sans', sans-serif;
    font-size:.95rem;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input:focus, select:focus{
    border-color:var(--moss);
  }
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:9px;
  }
  .chip{
    border:1px solid var(--line);
    padding:12px 14px;
    font-size:.85rem;
    cursor:pointer;
    user-select:none;
    background:var(--card);
    transition:all .15s;
    line-height:1.3;
  }
  .chip:hover{border-color:var(--moss);}
  .chip.sel{
    background:var(--moss);
    border-color:var(--moss);
    color:#0e1a15;
    font-weight:500;
  }
  .chip-note{
    font-size:.72rem;
    color:var(--muted-lt);
    margin-top:-10px;
    margin-bottom:16px;
  }
  .count-hint{
    font-size:.72rem;
    color:var(--clay);
    margin-top:8px;
    min-height:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .row-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  footer.nav{
    padding:0 32px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  button{
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-next{
    background:var(--moss);
    color:#0e1a15;
    padding:13px 26px;
    font-size:.78rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    transition:background .15s, transform .1s;
  }
  .btn-next:hover{background:var(--moss-hover); transform:translateY(-1px);}
  .btn-next:disabled{
    background:#3a4d43;
    color:#7c8a80;
    cursor:not-allowed;
    transform:none;
  }
  .btn-back{
    background:transparent;
    color:var(--muted-lt);
    font-size:.78rem;
    text-decoration:underline;
    text-underline-offset:3px;
    font-family:'IBM Plex Mono', monospace;
  }
  .btn-back:hover{color:var(--ink);}
  .btn-back.invisible{visibility:hidden;}

  .yesno{
    display:flex;
    gap:10px;
  }
  .yesno .chip{flex:1; text-align:center;}

  .result{
    text-align:center;
  }
  .result .eyebrow{margin-bottom:14px;}
  .result h1{font-size:1.9rem;}
  .result-card{
    text-align:left;
    background:var(--card-alt);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-top:18px;
    font-size:.85rem;
    line-height:1.7;
  }
  .result-card dt{
    color:var(--muted-lt);
    text-transform:uppercase;
    font-size:.68rem;
    letter-spacing:.06em;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
  }
  .result-card dt:first-child{margin-top:0;}
  .result-card dd{margin:0; color:var(--ink);}
  .result-dt-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-top:10px;
  }
  .result-dt-row:first-child{margin-top:0;}
  .result-dt-row dt{margin:0;}
  .edit-link{
    background:transparent;
    color:var(--moss);
    font-size:.7rem;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .edit-link:hover{color:var(--clay);}

  .ingredient-list{
    margin-top:24px;
    border-top:1px solid var(--line);
  }
  .ing-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .ing-info{flex:1; min-width:0;}
  .ing-name{
    font-family:'Fraunces', serif;
    font-size:1rem;
    color:var(--moss-dark);
  }
  .ing-from{
    font-size:.7rem;
    color:var(--muted-lt);
    margin-top:2px;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-family:'IBM Plex Mono', monospace;
  }
  .ing-conflict{
    background:var(--warn-bg);
    margin:0 -14px;
    padding-left:14px;
    padding-right:14px;
    border-bottom-color:#e9cdb4;
  }
  .ing-warn-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .ing-warn{
    font-size:.72rem;
    color:var(--warn);
    font-weight:500;
  }
  .swap-btn{
    font-size:.7rem;
    color:var(--moss-dark);
    background:var(--card);
    border:1px solid var(--moss);
    padding:4px 9px;
    border-radius:1px;
    white-space:nowrap;
  }
  .swap-btn:hover{background:var(--moss); color:var(--card);}
  .ing-ctrl{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .stepper{
    width:26px; height:26px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--moss-dark);
    font-size:1rem;
    line-height:1;
    border-radius:1px;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s;
  }
  .stepper:hover{border-color:var(--moss);}
  .dose-val{
    font-size:.82rem;
    min-width:82px;
    text-align:center;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-family:'IBM Plex Mono', monospace;
  }
  .ing-remove{
    width:24px; height:24px;
    background:transparent;
    color:var(--muted-lt);
    font-size:1.1rem;
    line-height:1;
    flex-shrink:0;
    transition:color .15s;
  }
  .ing-remove:hover{color:var(--warn);}
  .add-wrap{margin-top:14px;}
  .add-select{
    width:100%;
    padding:12px 14px;
    border:1px dashed var(--line);
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:.85rem;
    color:var(--muted);
    border-radius:1px;
  }

  .tab-bar{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .tab-btn{
    background:transparent;
    padding:10px 4px 12px;
    margin-right:20px;
    font-size:.76rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--muted-lt);
    border-bottom:2px solid transparent;
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .15s, border-color .15s;
    font-family:'IBM Plex Mono', monospace;
  }
  .tab-btn:hover{color:var(--moss-dark);}
  .tab-btn.active{
    color:var(--moss-dark);
    border-bottom-color:var(--moss);
    font-weight:500;
  }
  .tab-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--moss);
    display:inline-block;
  }
  .tab-pane{min-height:120px;}
  .tab-hint{
    font-size:.82rem;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 14px;
  }
  .dropzone{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border:1px dashed var(--line);
    padding:30px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .dropzone:hover{
    border-color:var(--moss);
    background:var(--card-alt);
  }
  .drop-label{
    font-size:.85rem;
    color:var(--ink);
    font-weight:500;
  }
  .drop-sub{
    font-size:.72rem;
    color:var(--muted-lt);
    font-family:'IBM Plex Mono', monospace;
  }
  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    padding:14px 16px;
    background:var(--card-alt);
  }
  .file-info{flex:1; min-width:0;}
  .file-name{
    font-size:.85rem;
    color:var(--moss-dark);
    word-break:break-all;
  }
  .file-meta{
    font-size:.7rem;
    color:var(--muted-lt);
    margin-top:2px;
    font-family:'IBM Plex Mono', monospace;
  }
  .upload-note{
    font-size:.72rem;
    color:var(--muted-lt);
    line-height:1.5;
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
  }
  .section-divider{
    border-top:1px dashed var(--line);
    margin:26px 0 18px;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.15rem;
    color:var(--moss-dark);
    margin:0 0 6px;
    text-align:center;
  }

  @media (max-width:480px){
    .chip-grid{grid-template-columns:1fr;}
    .row-2{grid-template-columns:1fr;}
    .panel{padding:28px 20px;}
    header.top, .track-wrap, footer.nav{padding-left:20px; padding-right:20px;}
  }

  /* --- AI chat: live regimen adjustment --- */
  .chat-section{margin-top:8px;}
  .chat-card{
    border:1px solid var(--line);
    border-radius:2px;
    background:linear-gradient(180deg, var(--card) 0%, #eef5f0 100%);
    overflow:hidden;
  }
  .chat-card-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:var(--moss-dark);
    color:#eaf2ec;
  }
  .chat-dot{
    width:8px; height:8px; border-radius:50%;
    background:#3fc6e8;
    box-shadow:0 0 0 0 rgba(63,198,232,.6);
    animation:chatPulseDot 2s infinite;
    flex-shrink:0;
  }
  @keyframes chatPulseDot{
    0%{box-shadow:0 0 0 0 rgba(63,198,232,.55);}
    70%{box-shadow:0 0 0 7px rgba(63,198,232,0);}
    100%{box-shadow:0 0 0 0 rgba(63,198,232,0);}
  }
  .chat-card-head-text{flex:1; min-width:0;}
  .chat-card-title{
    font-family:'Fraunces', serif;
    font-size:.98rem;
    color:#eaf2ec;
  }
  .chat-card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:.65rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#9fb8ab;
    margin-top:2px;
  }
  .chat-log{
    max-height:360px;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .chat-empty{
    font-size:.82rem;
    color:var(--muted-lt);
    text-align:center;
    padding:10px 6px 2px;
    line-height:1.5;
  }
  .chat-msg{
    max-width:86%;
    padding:10px 13px;
    border-radius:3px;
    font-size:.86rem;
    line-height:1.5;
  }
  .chat-msg.user{
    align-self:flex-end;
    background:var(--moss);
    color:#fff;
    border-bottom-right-radius:1px;
  }
  .chat-msg.ai{
    align-self:flex-start;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:1px;
  }
  .chat-msg.ai .chat-msg-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:.62rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--clay);
    margin-bottom:4px;
  }
  .chat-diff{
    margin-top:9px;
    border:1px dashed var(--line);
    border-radius:2px;
    padding:8px 10px;
    background:var(--card);
  }
  .chat-diff-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    padding:3px 0;
  }
  .chat-diff-name{color:var(--moss-dark); flex:1; min-width:0;}
  .chat-diff-change{white-space:nowrap; font-variant-numeric:tabular-nums;}
  .chat-diff-change.up{color:var(--moss-hover);}
  .chat-diff-change.down{color:var(--warn);}
  .chat-diff-change.new{color:var(--clay);}
  .chat-diff-change.off{color:var(--muted-lt); text-decoration:line-through;}
  .chat-typing{
    align-self:flex-start;
    display:flex; align-items:center; gap:5px;
    padding:12px 14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    border-bottom-left-radius:1px;
  }
  .chat-typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--muted-lt);
    animation:chatBounce 1.1s infinite ease-in-out;
  }
  .chat-typing span:nth-child(2){animation-delay:.15s;}
  .chat-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes chatBounce{
    0%,60%,100%{transform:translateY(0); opacity:.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }
  .chat-chips{
    display:flex; flex-wrap:wrap; gap:7px;
    padding:0 16px 12px;
  }
  .chat-chip{
    font-family:'Work Sans', sans-serif;
    font-size:.72rem;
    color:var(--moss-dark);
    background:#fff;
    border:1px solid var(--line);
    padding:6px 11px;
    border-radius:20px;
    transition:border-color .15s, background .15s;
    text-align:left;
  }
  .chat-chip:hover{border-color:var(--moss); background:var(--card);}
  .chat-input-row{
    display:flex; gap:8px;
    padding:12px 16px 16px;
    border-top:1px solid var(--line);
  }
  .chat-input{
    flex:1;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'Work Sans', sans-serif;
    font-size:.86rem;
    background:#fff;
    color:var(--ink);
  }
  .chat-input:focus{outline:none; border-color:var(--moss);}
  .chat-send{
    padding:0 18px;
    background:var(--moss);
    color:#fff;
    border-radius:2px;
    font-size:.85rem;
    white-space:nowrap;
    transition:background .15s;
  }
  .chat-send:hover{background:var(--moss-hover);}
  .chat-send:disabled{background:var(--muted-lt); cursor:default;}

  @keyframes ingPulse{
    0%{background:rgba(63,198,232,.28);}
    100%{background:transparent;}
  }
  .ing-row.ing-updated{animation:ingPulse 2.4s ease-out;}

  /* --- Packaging & delivery format --- */
  .pack-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
    margin:22px 0;
  }
  .pack-card{
    border:1px solid var(--line);
    border-radius:2px;
    background:#fff;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .pack-card-head{display:flex; align-items:center; gap:12px;}
  .pack-visual{
    width:52px; height:52px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--card);
    border-radius:2px;
    position:relative;
  }
  .pack-visual.blister{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:4px;
    padding:8px;
  }
  .pack-visual.blister span{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--moss);
    opacity:.85;
  }
  .pack-visual.sachet, .pack-visual.dosepack{
    border:1.5px dashed var(--muted-lt);
    background:var(--card-alt);
  }
  .pack-visual.sachet::after, .pack-visual.dosepack::after{
    content:"";
    position:absolute; top:6px; left:8px; right:8px;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--muted-lt) 0 4px, transparent 4px 8px);
  }
  .pack-visual.bottle{background:transparent;}
  .pack-visual.bottle::before{
    content:"";
    width:26px; height:38px;
    border-radius:6px 6px 3px 3px;
    background:var(--moss-dark);
    display:block;
  }
  .pack-visual.bottle::after{
    content:"";
    position:absolute; top:2px; left:50%; transform:translateX(-50%);
    width:12px; height:8px;
    border-radius:2px;
    background:var(--clay);
  }
  .pack-card-title{font-family:'Fraunces', serif; font-size:1.05rem; color:var(--ink);}
  .pack-card-format{
    font-family:'IBM Plex Mono', monospace;
    font-size:.66rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--moss-hover);
    margin-top:2px;
  }
  .pack-card-desc{font-size:.83rem; color:var(--muted); line-height:1.5;}
  .pack-items-list{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-top:2px;
  }
  .pack-item-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    color:var(--moss-dark);
  }

<script>
const GOALS = ["Weight Management","Eye Health","Digestion","Cognition","Bone Protection","Post-Workout","Pre-Workout","Hair and Nails","Energy","Mood","Joint Health","Stress","Immunity","General Health","Heart Health"];
const RESTRICTIONS = ["Lactose Intolerance","Gluten Intolerance","Peanut Allergy","Soy Allergy","Fish Allergy"];

// Maps each goal to candidate ingredients with a starting dose.
// Ingredients are deduped and merged across selected goals.
const INGREDIENT_MAP = {

  "Cognition": [{n:"Lion's Mane Extract",d:500,u:"mg"},{n:"Omega-3 (DHA)",d:400,u:"mg"},{n:"Bacopa Monnieri",d:300,u:"mg"}],

  "Joint Health": [{n:"Glucosamine Sulfate",d:1500,u:"mg"},{n:"Turmeric (Curcumin)",d:500,u:"mg"},{n:"Omega-3 (EPA)",d:400,u:"mg"}],
  "Stress": [{n:"Ashwagandha (KSM-66)",d:300,u:"mg"},{n:"L-Theanine",d:200,u:"mg"},{n:"Magnesium Glycinate",d:200,u:"mg"}],
  "Immunity": [{n:"Vitamin C",d:500,u:"mg"},{n:"Zinc",d:15,u:"mg"},{n:"Elderberry Extract",d:300,u:"mg"}],
  "General Health": [{n:"Multivitamin Base",d:1,u:"capsule"},{n:"Vitamin D3",d:2000,u:"IU"},{n:"Omega-3 (DHA)",d:400,u:"mg"}],
  "Heart Health": [{n:"Omega-3 (EPA)",d:600,u:"mg"},{n:"CoQ10",d:100,u:"mg"},{n:"Vitamin K2",d:100,u:"mcg"}]

const EXTRA_INGREDIENTS = [
  {n:"Vitamin D3",d:2000,u:"IU"},{n:"Magnesium Glycinate",d:200,u:"mg"},{n:"Vitamin C",d:500,u:"mg"},
  {n:"Zinc",d:15,u:"mg"},{n:"Omega-3 (DHA)",d:400,u:"mg"},{n:"B-Complex",d:1,u:"capsule"},
  {n:"Iron Bisglycinate",d:18,u:"mg"},{n:"CoQ10",d:100,u:"mg"},{n:"Probiotic Blend",d:10,u:"billion CFU"}
];

// Which restrictions conflict with which ingredients, and what to swap in instead.
const RESTRICTION_CONFLICTS = {
  "Fish Allergy": {
    ingredients: ["Omega-3 (EPA)","Omega-3 (DHA)"],
    substitute: n => ({ name: "Algae-Based " + n, dose: n.includes("EPA") ? 600 : 400, unit: "mg" })
  },
  "Lactose Intolerance": {
    ingredients: ["Probiotic Blend"],
    substitute: () => ({ name: "Dairy-Free Probiotic Blend", dose: 10, unit: "billion CFU" })
  },
  "Soy Allergy": { ingredients: [], substitute: null },
  "Peanut Allergy": { ingredients: [], substitute: null },
  "Gluten Intolerance": { ingredients: [], substitute: null }
};

function conflictsFor(ingredientName, restrictions){
  return restrictions.filter(r => (RESTRICTION_CONFLICTS[r]?.ingredients || []).includes(ingredientName));
}

// --- Skincare recommendation data ---
const SKIN_TYPES = ["Oily","Dry","Combination","Normal","Sensitive"];
const SKIN_CONCERNS = ["Acne & Breakouts","Fine Lines & Wrinkles","Hyperpigmentation","Dullness","Redness & Sensitivity","Large Pores","Dehydration"];

const SKIN_TYPE_BASE = {
  "Oily": [{n:"Gel Cleanser (Oil-Free)", note:"AM & PM cleanser"},{n:"Lightweight Gel Moisturizer", note:"Daily moisturizer"}],
  "Dry": [{n:"Cream Cleanser", note:"AM & PM cleanser"},{n:"Rich Barrier Cream", note:"Daily moisturizer"}],
  "Combination": [{n:"Balancing Foam Cleanser", note:"AM & PM cleanser"},{n:"Lightweight Lotion Moisturizer", note:"Daily moisturizer"}],
  "Normal": [{n:"Gentle Daily Cleanser", note:"AM & PM cleanser"},{n:"Everyday Moisturizer", note:"Daily moisturizer"}],
  "Sensitive": [{n:"Fragrance-Free Cleanser", note:"AM & PM cleanser"},{n:"Ceramide Barrier Cream", note:"Daily moisturizer"}]
};

const SKINCARE_MAP = {
  "Acne & Breakouts": [{n:"Salicylic Acid Treatment (2%)", note:"PM, spot or full-face"},{n:"Niacinamide Serum (10%)", note:"AM serum"}],
  "Fine Lines & Wrinkles": [{n:"Retinol Treatment (0.3%)", note:"PM, 2–3x/week to start"},{n:"Peptide Complex Serum", note:"AM or PM serum"}],
  "Hyperpigmentation": [{n:"Vitamin C Serum (15%)", note:"AM serum"},{n:"Tranexamic Acid Serum", note:"AM or PM serum"}],
  "Dullness": [{n:"AHA Exfoliating Toner", note:"2–3x/week"},{n:"Vitamin C Serum (15%)", note:"AM serum"}],
  "Redness & Sensitivity": [{n:"Centella Asiatica Cream", note:"AM & PM, barrier repair"},{n:"Mineral SPF 30+", note:"AM, daily"}],
  "Large Pores": [{n:"Niacinamide Serum (10%)", note:"AM serum"},{n:"Clay Mask", note:"Weekly treatment"}],
  "Dehydration": [{n:"Hyaluronic Acid Serum", note:"AM & PM, on damp skin"},{n:"Ceramide Moisturizer", note:"Daily moisturizer"}]
};

function buildFormula(goals){
  const byName = {};
  goals.forEach(g => {
    (INGREDIENT_MAP[g] || []).forEach(ing => {
      if(!byName[ing.n]) byName[ing.n] = { name: ing.n, dose: ing.d, unit: ing.u, from: [g] };
      else if(!byName[ing.n].from.includes(g)) byName[ing.n].from.push(g);
    });
  });
  return Object.values(byName);
}

// Rebuilds the formula from the current goal selection, while preserving
// any manual dose edits, removals, and manually-added ingredients.
function rebuildFormula(){
  const base = buildFormula(state.goals).filter(ing => !state.removedNames.includes(ing.name));
  base.forEach(ing => {
    if(state.doseOverrides[ing.name] !== undefined) ing.dose = state.doseOverrides[ing.name];
  });
  state.addedIngredients.forEach(a => {
    if(!base.some(b => b.name === a.name)){
      const dose = state.doseOverrides[a.name] !== undefined ? state.doseOverrides[a.name] : a.dose;
      base.push({ name: a.name, dose, unit: a.unit, from: ["Added by you"] });
    }
  });
  state.formula = base;
  state.formulaGoals = state.goals.slice();
}

function goalsChanged(){
  const a = state.goals.slice().sort().join("|");
  const b = state.formulaGoals.slice().sort().join("|");
  return a !== b;
}

function buildSkincare(){
  const byName = {};
  (SKIN_TYPE_BASE[state.skinType] || []).forEach(p => {
    byName[p.n] = { name: p.n, note: p.note, from: ["Skin type: " + state.skinType] };
  });
  state.skinConcerns.forEach(c => {
    (SKINCARE_MAP[c] || []).forEach(p => {
      if(!byName[p.n]) byName[p.n] = { name: p.n, note: p.note, from: [c] };
      else if(!byName[p.n].from.includes(c)) byName[p.n].from.push(c);
    });
  });
  state.skincare = Object.values(byName).filter(p => !state.removedSkincareNames.includes(p.name));
  state.skincareProfile = { type: state.skinType, concerns: state.skinConcerns.slice() };
}

function skincareChanged(){
  const a = state.skinType + "|" + state.skinConcerns.slice().sort().join(",");
  const b = state.skincareProfile.type + "|" + state.skincareProfile.concerns.slice().sort().join(",");
  return a !== b;
}

const state = {
  step: 0,
  name: "",
  sex: "",
  birthMonth: "",
  goals: [],
  email: "",
  country: "",
  diet: [],
  lifestyle: [],
  sleep: [],
  hasRestrictions: null,
  restrictions: [],
  dietType: "",
  formulaName: "",
  formula: null,
  formulaGoals: [],
  removedNames: [],
  doseOverrides: {},
  addedIngredients: [],
  activeUploadTab: "device",
  uploads: { device: null, healthcare: null, genetic: null },
  editReturn: false,
  skinType: "",
  skinConcerns: [],
  skincare: null,
  skincareProfile: { type: "", concerns: [] },
  removedSkincareNames: [],
  chatMessages: [],
  chatTyping: false,
  chatPendingHighlights: [],
  packagingChoice: "airless",
  deliveryCadence: "30",
  shipping: { address1: "", address2: "", city: "", region: "", postal: "" },
  payment: { cardName: "", cardNumber: "", expiry: "", cvc: "" },
  orderNumber: ""
};

const steps = [
  "intro","name","about","goals","email","country",
  "diet","lifestyle","sleep","restrictions","dietType","skincare","biodata","formulaName","result","chat","packaging","checkout","confirmation"
];

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.forEach(c => {
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}

function toggle(arr, val, max){
  const i = arr.indexOf(val);
  if(i >= 0){ arr.splice(i,1); return; }
  if(max && arr.length >= max) return;
  arr.push(val);
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const key = steps[state.step];
  const TERMINAL_STEPS = ["intro","result","chat","packaging","checkout","confirmation"];
  const isTerminal = TERMINAL_STEPS.includes(key);
  const total = steps.length - TERMINAL_STEPS.length; // exclude terminal/summary pages from progress math
  const progress = key === "intro" ? 0 : isTerminal ? 100 : Math.round(((state.step) / total) * 100);

  app.appendChild(
    el("header", {class:"top"},
      el("div", {class:"mark"}, "the ritual ", el("b",{},"wizard")),
      el("div", {class:"rx-no"}, "RITUAL QUIZ · Nº 001")
    )
  );

  if(!isTerminal){
    const wrap = el("div", {class:"track-wrap"});
    const track = el("div", {class:"track"});
    const fill = el("div", {class:"track-fill"});
    fill.style.width = progress + "%";
    track.appendChild(fill);
    wrap.appendChild(track);
    wrap.appendChild(el("div", {class:"step-label"},
      el("span",{}, "Step " + state.step + " of " + total),
      el("span",{}, progress + "%")
    ));
    app.appendChild(wrap);
  }

  const panel = el("div", {class:"panel"});
  app.appendChild(panel);
  renderStep(key, panel);

  if(!isTerminal){
    const footer = el("footer", {class:"nav"});
    const back = el("button", {class:"btn-back" + (state.step===1 ? " invisible" : ""), onclick: () => {
      if(state.editReturn){ const dest = state.editReturn; state.editReturn = false; state.step = steps.indexOf(dest); }
      else state.step--;
      render();
    }}, "← Back");
    const next = el("button", {class:"btn-next", onclick: () => {
      if(!validateStep(key)) return;
      if(state.editReturn){
        const dest = state.editReturn;
        state.editReturn = false;
        state.step = steps.indexOf(dest);
      } else {
        state.step++;
      }
      render();
    }}, key === "formulaName" ? "See my formula →" : (state.editReturn ? "Save & return →" : "Continue →"));
    if(!isValid(key)) next.disabled = true;
    footer.appendChild(back);
    footer.appendChild(next);
    app.appendChild(footer);
  }
}

function isValid(key){
  switch(key){
    case "name": return state.name.trim().length > 0;
    case "about": return state.sex && state.birthMonth;
    case "goals": return state.goals.length >= 3 && state.goals.length <= 5;
    case "email": return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
    case "country": return state.country !== "";
    case "diet": return true;
    case "lifestyle": return true;
    case "sleep": return true;
    case "restrictions": return state.hasRestrictions !== null && (state.hasRestrictions === "No" || state.restrictions.length > 0);
    case "dietType": return state.dietType !== "";
    case "skincare": return state.skinType !== "";
    case "biodata": return true;
    case "formulaName": return state.formulaName.trim().length > 0;
    default: return true;
  }
}
function validateStep(key){ return isValid(key); }

function renderStep(key, panel){
  if(key === "intro"){
    panel.appendChild(el("div", {class:"eyebrow"}, "Welcome"));
    panel.appendChild(el("h1", {}, "Let's build something made for your body, not the average one."));

    panel.appendChild(el("button", {class:"btn-next", style:"align-self:flex-start", onclick: () => { state.step = 1; render(); }}, "Let's go →"));
    return;
  }

  if(key === "name"){
    panel.appendChild(el("div", {class:"eyebrow"}, "First things first"));
    panel.appendChild(el("h1", {}, "Who are we formulating for?"));
    const field = el("div", {class:"field"});
    const input = el("input", {type:"text", placeholder:"Your first name", value: state.name});
    input.addEventListener("input", e => { state.name = e.target.value; syncButton("name"); });
    field.appendChild(input);
    panel.appendChild(field);
    return;
  }

  if(key === "about"){
    panel.appendChild(el("div", {class:"eyebrow"}, "Good to meet you" + (state.name ? ", " + state.name : "") + "."));
    panel.appendChild(el("h1", {}, "A couple of biological basics."));
    panel.appendChild(el("p", {class:"sub"}, "Nutrient needs and safe dosing shift with sex at birth and age — this keeps your formula accurate."));

    const row = el("div", {class:"row-2"});

    const f1 = el("div", {class:"field"});
    f1.appendChild(el("label", {class:"flabel"}, "Sex at birth"));
    const sel1 = el("select", {});
    ["Select…","Prefer not to disclose","Male","Female"].forEach(o => {
      const opt = el("option", {value: o === "Select…" ? "" : o}, o);
      if(state.sex === o) opt.setAttribute("selected","selected");
      sel1.appendChild(opt);
    });
    sel1.addEventListener("change", e => { state.sex = e.target.value; syncButton("about"); });
    f1.appendChild(sel1);

    const f2 = el("div", {class:"field"});
    f2.appendChild(el("label", {class:"flabel"}, "Birthday month"));
    const sel2 = el("select", {});
    const months = ["Select…","January","February","March","April","May","June","July","August","September","October","November","December"];
    months.forEach(o => {
      const opt = el("option", {value: o === "Select…" ? "" : o}, o);
      if(state.birthMonth === o) opt.setAttribute("selected","selected");
      sel2.appendChild(opt);
    });
    sel2.addEventListener("change", e => { state.birthMonth = e.target.value; syncButton("about"); });
    f2.appendChild(sel2);

    row.appendChild(f1); row.appendChild(f2);
    panel.appendChild(row);
    return;
  }

  if(key === "goals"){
    panel.appendChild(el("div", {class:"eyebrow"}, "Priorities"));
    panel.appendChild(el("h1", {}, "Where do you want to feel the biggest difference?"));
    panel.appendChild(el("div", {class:"chip-note"}, "Pick between 3 and 5 — this is what drives your formula."));
    const grid = el("div", {class:"chip-grid"});
    GOALS.forEach(g => {
      const chip = el("div", {class:"chip" + (state.goals.includes(g) ? " sel" : "")}, g);
      chip.addEventListener("click", () => {
        toggle(state.goals, g, 5);
        render();
      });
      grid.appendChild(chip);
    });
    panel.appendChild(grid);
    panel.appendChild(el("div", {class:"count-hint"}, state.goals.length + " selected" + (state.goals.length < 3 ? " · pick at least 3" : "")));
    return;
  }

  if(key === "email"){
    panel.appendChild(el("div", {class:"eyebrow"}, "Stay in the loop"));
    panel.appendChild(el("h1", {}, "Where should we send your results?"));
    panel.appendChild(el("p", {class:"sub"}, "You'll get a copy of your formula and can revisit or adjust it any time."));
    const field = el("div", {class:"field"});
    const input = el("input", {type:"email", placeholder:"you@email.com", value: state.email});

const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function findFormulaIng(name){
  return state.formula.find(f => f.name === name);
}

// Adds an ingredient to the formula (or bumps its dose if already present),
// using the same state channels the manual "+ Add an ingredient" control uses,
// so a chat-driven change behaves identically to a manual one on re-render.
function chatAdd(name, dose, unit, tag){
  state.removedNames = state.removedNames.filter(n => n !== name);
  const existing = findFormulaIng(name);
  if(existing){
    const before = existing.dose;
    existing.dose = dose;
    state.doseOverrides[name] = dose;
    return { name, before, after: dose, unit, cls: dose > before ? "up" : "down" };
  }
  if(!state.addedIngredients.some(a => a.name === name)) state.addedIngredients.push({ name, dose, unit });
  state.formula.push({ name, dose, unit, from: [tag || "Added by AI"] });
  return { name, before: null, after: dose, unit, cls: "new" };
}

function chatIncrease(name, delta, unit){
  const ing = findFormulaIng(name);
  if(!ing) return chatAdd(name, delta, unit, "Added by AI");
  const before = ing.dose;
  ing.dose = ing.dose + delta;
  state.doseOverrides[name] = ing.dose;
  return { name, before, after: ing.dose, unit: ing.unit, cls: "up" };
}

function chatRemove(name){
  const idx = state.formula.findIndex(f => f.name === name);
  if(idx === -1) return null;
  const before = state.formula[idx].dose;
  const unit = state.formula[idx].unit;
  state.formula.splice(idx, 1);
  if(!state.removedNames.includes(name)) state.removedNames.push(name);
  state.addedIngredients = state.addedIngredients.filter(a => a.name !== name);
  delete state.doseOverrides[name];
  return { name, before, after: 0, unit, cls: "off" };
}

// --- Skincare equivalents: same idea, but skincare items are presence/absence
// with a note, not a dose — so the diff shape is simpler (added/removed only).
function chatAddSkin(name, note, tag){
  state.removedSkincareNames = state.removedSkincareNames.filter(n => n !== name);
  if(state.skincare.some(s => s.name === name)) return null;
  state.skincare.push({ name, note, from: [tag || "Added by AI"] });
  return { name, skin: true, cls: "new" };
}
function chatRemoveSkin(name){
  const idx = state.skincare.findIndex(s => s.name === name);
  if(idx === -1) return null;
  state.skincare.splice(idx, 1);
  if(!state.removedSkincareNames.includes(name)) state.removedSkincareNames.push(name);
  return { name, skin: true, cls: "off" };
}

function extractDays(text){
  const found = DAY_NAMES.filter(d => new RegExp(d, "i").test(text));
  return found;
}
function extractDateHint(text){
  const m = text.match(/\bon\s+([A-Za-z]+\s+\d{1,2}(?:st|nd|rd|th)?)/i)
    || text.match(/\b(next week|next month|this weekend|in \d+ days?)\b/i)
    || text.match(/\bfrom\s+the\s+\d{1,2}(?:st|nd|rd|th)?\s+to\s+the\s+\d{1,2}(?:st|nd|rd|th)?/i);
  return m ? m[0].replace(/^on\s+/i, "") : null;
}

function interpretChatMessage(text){
  for(const intent of CHAT_INTENTS){
    if(intent.test(text)) return intent.respond(text);
  }
  return {
    reply: `I want to make sure I get this right \u2014 could you say a bit more, or try one of the examples below?`,
    diffs: [],
    fallback: true
  };
}

function sendChatMessage(text){
  text = (text || "").trim();
  if(!text || state.chatTyping) return;
  state.chatMessages.push({ role: "user", text });
  state.chatTyping = true;
  render();
  const delay = 650 + Math.random() * 550;
  setTimeout(() => {
    const result = interpretChatMessage(text);
    state.chatTyping = false;
    state.chatMessages.push({ role: "ai", text: result.reply, diffs: result.diffs || [] });
    state.chatPendingHighlights = (result.diffs || []).map(d => d.name);
    render();
    setTimeout(() => { state.chatPendingHighlights = []; }, 2500);
    const log = document.querySelector(".chat-log");
    if(log) log.scrollTop = log.scrollHeight;
  }, delay);
}

function renderChat(panel){
  panel.appendChild(el("div", {class:"section-divider"}));

  section.appendChild(el("h2", {class:"section-title"}, "Adjust your regimen — just tell it"));
  section.appendChild(el("p", {class:"sub", style:"margin-bottom:14px;"},
    "One assistant for both sides of your regimen \u2014 nutrition and skincare. Try travel plans, a new workout schedule, or how your skin's behaving this week."));

  const card = el("div", {class:"chat-card"});
  const head = el("div", {class:"chat-card-head"});
  head.appendChild(el("span", {class:"chat-dot"}));
  const headText = el("div", {class:"chat-card-head-text"});
  headText.appendChild(el("div", {class:"chat-card-title"}, "Apotek AI"));
  headText.appendChild(el("div", {class:"chat-card-sub"}, "Live regimen assistant"));
  head.appendChild(headText);
  card.appendChild(head);

  const log = el("div", {class:"chat-log"});
  if(state.chatMessages.length === 0){
    log.appendChild(el("div", {class:"chat-empty"}, "No messages yet — try an example below, or type your own."));
  }
  state.chatMessages.forEach(m => {
    const bubble = el("div", {class:"chat-msg " + (m.role === "user" ? "user" : "ai")});
    if(m.role === "ai"){
      bubble.appendChild(el("div", {class:"chat-msg-label"}, "Apotek AI"));
    }
    bubble.appendChild(el("div", {}, m.text));
    if(m.diffs && m.diffs.length){
      const diffBox = el("div", {class:"chat-diff"});
      m.diffs.forEach(d => {
        const row = el("div", {class:"chat-diff-row"});
        row.appendChild(el("span", {class:"chat-diff-name"}, d.name));
        let changeText;
        if(d.skin) changeText = d.cls === "new" ? "added to routine" : "removed from routine";
        else if(d.cls === "new") changeText = "added \u00b7 " + d.after + " " + d.unit;
        else if(d.cls === "off") changeText = d.before + " " + d.unit + " \u2192 paused";
        else changeText = d.before + " \u2192 " + d.after + " " + d.unit;
        row.appendChild(el("span", {class:"chat-diff-change " + d.cls}, changeText));
        diffBox.appendChild(row);
      });
      bubble.appendChild(diffBox);
    }
    log.appendChild(bubble);
  });
  if(state.chatTyping){
    const typing = el("div", {class:"chat-typing"});
    typing.appendChild(el("span")); typing.appendChild(el("span")); typing.appendChild(el("span"));
    log.appendChild(typing);
  }
  card.appendChild(log);

  const chips = el("div", {class:"chat-chips"});
  CHAT_EXAMPLES.forEach(ex => {
    const chip = el("button", {class:"chat-chip", type:"button"}, "\u201c" + ex + "\u201d");
    chip.addEventListener("click", () => sendChatMessage(ex));
    chips.appendChild(chip);
  });
  card.appendChild(chips);

  const inputRow = el("div", {class:"chat-input-row"});
  const input = el("input", {class:"chat-input", type:"text", placeholder:"Tell your AI what's changing…"});
  input.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ sendChatMessage(input.value); input.value = ""; }
  });
  const sendBtn = el("button", {class:"chat-send", type:"button"}, "Send");
  sendBtn.addEventListener("click", () => { sendChatMessage(input.value); input.value = ""; });
  inputRow.appendChild(input);
  inputRow.appendChild(sendBtn);
  card.appendChild(inputRow);

  section.appendChild(card);
  panel.appendChild(section);

  setTimeout(() => {
    const logEl = panel.querySelector(".chat-log");
    if(logEl) logEl.scrollTop = logEl.scrollHeight;
  }, 0);
}

function renderNutritionList(panel){
  const list = el("div", {class:"ingredient-list"});
  const restrictions = state.hasRestrictions === "Yes" ? state.restrictions : [];
  state.formula.forEach((ing, idx) => {
    const conflicts = conflictsFor(ing.name, restrictions);
    const row = el("div", {class:"ing-row" + (conflicts.length ? " ing-conflict" : "") + (state.chatPendingHighlights.includes(ing.name) ? " ing-updated" : "")});
    const info = el("div", {class:"ing-info"});
    info.appendChild(el("div", {class:"ing-name"}, ing.name));
    info.appendChild(el("div", {class:"ing-from"}, "For: " + ing.from.join(", ")));
    if(conflicts.length){
      const warn = el("div", {class:"ing-warn"}, "⚠ Conflicts with " + conflicts.join(", "));
      const conf = RESTRICTION_CONFLICTS[conflicts[0]];
      if(conf && conf.substitute){
        const sub = conf.substitute(ing.name);
        const swapBtn = el("button", {class:"swap-btn"}, "Swap for " + sub.name);
        swapBtn.addEventListener("click", () => { swapIngredient(idx, sub); });
        const warnRow = el("div", {class:"ing-warn-row"}, warn, swapBtn);
        info.appendChild(warnRow);
      } else {
        info.appendChild(warn);
      }
    }
    row.appendChild(info);

    const ctrl = el("div", {class:"ing-ctrl"});
    const minus = el("button", {class:"stepper", onclick: () => { adjustDose(idx, -1); }}, "–");
    const doseSpan = el("span", {class:"dose-val"}, ing.dose + " " + ing.unit);
    const plus = el("button", {class:"stepper", onclick: () => { adjustDose(idx, 1); }}, "+");
    ctrl.appendChild(minus); ctrl.appendChild(doseSpan); ctrl.appendChild(plus);
    row.appendChild(ctrl);

    const rm = el("button", {class:"ing-remove", title:"Remove", onclick: () => {
      const removed = state.formula[idx];
      state.formula.splice(idx,1);
      if(removed.from.includes("Added by you")){
        state.addedIngredients = state.addedIngredients.filter(a => a.name !== removed.name);
      } else if(!state.removedNames.includes(removed.name)){
        state.removedNames.push(removed.name);
      }
      delete state.doseOverrides[removed.name];
      render();
    }}, "×");
    row.appendChild(rm);
    list.appendChild(row);
  });
  panel.appendChild(list);
}

function renderAddIngredientControl(panel){
  const addWrap = el("div", {class:"add-wrap"});
  const addSel = el("select", {class:"add-select"});
  addSel.appendChild(el("option", {value:""}, "+ Add an ingredient…"));
  EXTRA_INGREDIENTS.filter(e => !state.formula.some(f => f.name === e.n)).forEach(e => {
    addSel.appendChild(el("option", {value: e.n}, e.n + " · " + e.d + e.u));
  });
  addSel.addEventListener("change", ev => {
    const chosen = EXTRA_INGREDIENTS.find(e => e.n === ev.target.value);
    if(chosen){
      state.removedNames = state.removedNames.filter(n => n !== chosen.n);
      if(!state.addedIngredients.some(a => a.name === chosen.n)){
        state.addedIngredients.push({ name: chosen.n, dose: chosen.d, unit: chosen.u });
      }
      state.formula.push({name: chosen.n, dose: chosen.d, unit: chosen.u, from: ["Added by you"]});
      render();
    }
  });
  addWrap.appendChild(addSel);
  panel.appendChild(addWrap);
}

// Classifies a nutrition item's physical form. Capsule-unit items and any
// mg-dose under 1000 read as a standard capsule; large mg doses (or gram
// doses) read as powder — this is exactly where real ingredients like
// Beta-Alanine and Citrulline Malate actually live in the market.
function ingredientForm(ing){
  if(ing.unit === "capsule") return "pill";
  if(ing.unit === "g") return "powder";
  if(ing.unit === "mg" && ing.dose >= 1000) return "powder";
  return "pill";
}

function packVisual(kind){
  if(kind === "blister"){
    const v = el("div", {class:"pack-visual blister"});
    for(let i=0;i<6;i++) v.appendChild(el("span"));
    return v;
  }
  if(kind === "bottle") return el("div", {class:"pack-visual bottle"});
  return el("div", {class:"pack-visual " + kind});
}

function computePrice(){
  const itemCount = state.formula.length + state.skincare.length;
  return Math.min(179, 69 + Math.max(0, itemCount - 3) * 7);
}

function packagingCounts(){
  const pills = state.formula.filter(f => ingredientForm(f) === "pill").length;
  const powders = state.formula.filter(f => ingredientForm(f) === "powder").length;
  const serums = state.skincare.length;
  return { pills, powders, serums };
}

  const counts = packagingCounts();
  const price = computePrice();
  const summary = el("div", {class:"order-summary-card"});
  summary.appendChild(el("div", {class:"order-summary-title"}, "“" + state.formulaName + "”"));
  if(counts.pills) summary.appendChild(el("div", {class:"order-line"}, el("span",{},"Blister pack"), el("b",{}, counts.pills + " ingredient" + (counts.pills!==1?"s":""))));
  if(counts.powders) summary.appendChild(el("div", {class:"order-line"}, el("span",{},"Sachets"), el("b",{}, counts.powders + " ingredient" + (counts.powders!==1?"s":""))));
  if(counts.serums) summary.appendChild(el("div", {class:"order-line"}, el("span",{}, state.packagingChoice === "dosepacks" ? "Dose packs" : "Airless bottles"), el("b",{}, counts.serums + " item" + (counts.serums!==1?"s":""))));
  summary.appendChild(el("div", {class:"order-line"}, el("span",{},"Delivery"), el("b",{}, "Every " + state.deliveryCadence + " days")));
  summary.appendChild(el("div", {class:"order-line total"}, el("span",{},"Total, per shipment"), el("b",{}, "$" + price)));

  const placeBtn = el("button", {class:"btn-next", id:"place-order-btn", style:"width:100%; margin-top:18px;", onclick: () => {
    state.orderNumber = "RX-" + Math.floor(100000 + Math.random()*900000);
    state.step = steps.indexOf("confirmation");
    render();
  }}, "Place order →");
  summary.appendChild(placeBtn);
  right.appendChild(summary);
  grid.appendChild(right);

  panel.appendChild(grid);

  const back = el("button", {class:"btn-back", style:"margin-top:18px;", onclick: () => {
    state.step = steps.indexOf("packaging");
    render();
  }}, "← Back to packaging");
  panel.appendChild(back);

  setTimeout(syncCheckoutButton, 0);
}

function field(label, type, value, onInput, placeholder){
  const wrap = el("div", {class:"field"});
  wrap.appendChild(el("label", {class:"flabel"}, label));
  const input = el("input", {type, value: value || "", placeholder: placeholder || ""});
  input.addEventListener("input", e => onInput(e.target.value));
  wrap.appendChild(input);
  return wrap;
}

function checkoutValid(){
  return !!(state.name.trim() && state.email.trim() && state.shipping.address1.trim() && state.shipping.city.trim() &&
    state.shipping.postal.trim() && state.payment.cardName.trim() && state.payment.cardNumber.trim());
}
function syncCheckoutButton(){
  const btn = document.getElementById("place-order-btn");
  if(btn) btn.disabled = !checkoutValid();
}

function renderConfirmationStep(panel){
  panel.classList.add("result");
  const wrap = el("div", {class:"confirm-wrap"});
  const check = el("div", {class:"confirm-check"});
  check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="#eaf2ec" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  wrap.appendChild(check);
  wrap.appendChild(el("div", {class:"eyebrow", style:"text-align:center;"}, "You're all set, " + (state.name || "friend")));
  wrap.appendChild(el("h1", {style:"text-align:center;"}, "“" + state.formulaName + "” is on its way."));
  wrap.appendChild(el("div", {style:"text-align:center;"}, el("span", {class:"confirm-order-no"}, "Order " + state.orderNumber)));

  const timeline = el("div", {class:"confirm-timeline"});
  const steps4 = [
    ["Confirmed", "Just now"],
    ["Compounded & packed", "1–2 days"],
    ["Shipped", "3–4 days"],
    ["At your door", "5–7 days"]
  ];
  steps4.forEach(([label, sub], i) => {
    const stepEl = el("div", {class:"confirm-step"});
    stepEl.appendChild(el("div", {class:"confirm-step-dot"}));
    stepEl.appendChild(el("div", {class:"confirm-step-label"}, label));
    stepEl.appendChild(el("div", {class:"confirm-step-sub"}, sub));
    timeline.appendChild(stepEl);
  });
  wrap.appendChild(timeline);

  wrap.appendChild(el("p", {class:"sub", style:"text-align:center; max-width:480px; margin:0 auto 24px;"},
    "Your AI keeps adjusting after this, too — the same chat you used to fine-tune your formula stays with your account, so a new travel plan or a rough week doesn't mean starting over."));

  const actions = el("div", {style:"display:flex; gap:12px; margin-top:6px; justify-content:center; flex-wrap:wrap;"});
  const home = el("a", {class:"btn-next", href:"index.html", style:"text-decoration:none; display:inline-flex; align-items:center;"}, "Return to homepage");
  const again = el("button", {class:"btn-back", onclick: () => {
    Object.assign(state, {step:0,name:"",sex:"",birthMonth:"",goals:[],email:"",country:"",diet:[],lifestyle:[],sleep:[],hasRestrictions:null,restrictions:[],dietType:"",formulaName:"",formula:null,formulaGoals:[],removedNames:[],doseOverrides:{},addedIngredients:[],activeUploadTab:"device",uploads:{device:null,healthcare:null,genetic:null},editReturn:false,skinType:"",skinConcerns:[],skincare:null,skincareProfile:{type:"",concerns:[]},removedSkincareNames:[],chatMessages:[],chatTyping:false,chatPendingHighlights:[],packagingChoice:"airless",deliveryCadence:"30",shipping:{address1:"",address2:"",city:"",region:"",postal:""},payment:{cardName:"",cardNumber:"",expiry:"",cvc:""},orderNumber:""});
    render();
  }}, "Start a new ritual");
  actions.appendChild(home);
  actions.appendChild(again);
  wrap.appendChild(actions);

  panel.appendChild(wrap);
}

function jumpToEdit(stepKey){
  state.editReturn = steps[state.step];
  state.step = steps.indexOf(stepKey);
  render();
}

function adjustDose(idx, dir){
  const ing = state.formula[idx];
  const step = ing.dose >= 1000 ? 100 : ing.dose >= 100 ? 25 : ing.dose >= 10 ? 5 : 1;
  ing.dose = Math.max(step, ing.dose + dir * step);
  state.doseOverrides[ing.name] = ing.dose;
  render();
}

function swapIngredient(idx, sub){
  const old = state.formula[idx];
  if(!state.removedNames.includes(old.name)) state.removedNames.push(old.name);
  delete state.doseOverrides[old.name];
  state.addedIngredients = state.addedIngredients.filter(a => a.name !== old.name);
  if(!state.addedIngredients.some(a => a.name === sub.name)){
    state.addedIngredients.push({ name: sub.name, dose: sub.dose, unit: sub.unit });
  }
  state.formula[idx] = { name: sub.name, dose: sub.dose, unit: sub.unit, from: old.from.filter(f => f !== "Added by you").concat(["Added by you"]) };
  render();
}

function syncButton(){
  const footer = document.querySelector("footer.nav");
  if(!footer) return;
  const next = footer.querySelector(".btn-next");
  if(next) next.disabled = !isValid(steps[state.step]);
}

render();
</script>
</body>
</html>
